name: Budowanie APK dla Androida

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala uruchomić budowanie ręcznie jednym przyciskiem

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Nadanie uprawnień do uruchomienia Gradle
        run: chmod +x gradlew

      - name: Budowanie pliku APK (Debug)
        run: ./gradlew assembleDebug

      - name: Udostępnienie gotowego pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: ZSMEAssist-APK
          path: app/build/outputs/apk/debug/app-debug.apk
