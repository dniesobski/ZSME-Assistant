name: Budowanie APK dla Androida

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory:

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Gradle w chmurze
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Budowanie pliku APK (Debug)
        run: gradle assembleDebug

      - name: Udostępnienie gotowego pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: ZSMEAssist-APK
          path: NAZWA_PODFOLDERU/app/build/outputs/apk/debug/app-debug.apk
